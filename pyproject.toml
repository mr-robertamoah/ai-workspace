[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workspace"
version = "0.1.0"
description = "AI-native engineering workspace CLI"
authors = [{ name = "ai-workspace contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=24",
    "isort>=5",
    "ruff>=0.4",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://github.com/mr-robertamoah/ai-workspace"
Repository = "https://github.com/mr-robertamoah/ai-workspace"

[project.scripts]
ai-workspace = "ai_workspace.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_workspace.data" = ["skills/**/*", "standards/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ai_workspace --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"src/ai_workspace/cli/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ai_workspace.cli".msg = "Business logic must not import from cli (presentation layer)."
[tool.black]
line-length = 100
target-version = ["py312"]
